#
# clang-tidy profile for the core libraries (Task 12.3), used by
# tools/clang-tidy.sh with --config-file. It covers src/asm/*.cc, src/sim/*.cc
# and the public headers in include/easym68k. Not covered: src/asm/core and
# tools/reference (they keep the original's layout and idioms), tests, tools
# and the GUI.
#
# Enabled: bug finders (bugprone, clang-analyzer), performance, and the parts
# of modernize/readability/misc/cppcoreguidelines/google that point at real
# defects or dead code. Left out on purpose: pure style checks that conflict
# with the Google style in .clang-format or with code ported 1:1 from the
# original (braces around single statements, trailing return types, magic
# numbers, C arrays, `long` in the original's file I/O signatures, identifier
# length, include-cleaner), and checks that are noise for an emulator
# (easily-swappable-parameters, enum-size).
Checks: >
  -*,
  bugprone-*,
  -bugprone-easily-swappable-parameters,
  clang-analyzer-*,
  -clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling,
  performance-*,
  -performance-enum-size,
  cppcoreguidelines-init-variables,
  cppcoreguidelines-pro-type-member-init,
  cppcoreguidelines-slicing,
  cppcoreguidelines-virtual-class-destructor,
  google-*,
  -google-readability-braces-around-statements,
  -google-readability-todo,
  -google-runtime-int,
  misc-definitions-in-headers,
  misc-misplaced-const,
  misc-new-delete-overloads,
  misc-redundant-expression,
  misc-static-assert,
  misc-throw-by-value-catch-by-reference,
  misc-unconventional-assign-operator,
  misc-uniqueptr-reset-release,
  misc-unused-*,
  misc-use-anonymous-namespace,
  modernize-deprecated-headers,
  modernize-loop-convert,
  modernize-make-unique,
  modernize-redundant-void-arg,
  modernize-use-bool-literals,
  modernize-use-emplace,
  modernize-use-equals-default,
  modernize-use-equals-delete,
  modernize-use-nullptr,
  modernize-use-override,
  readability-avoid-const-params-in-decls,
  readability-container-size-empty,
  readability-delete-null-pointer,
  readability-duplicate-include,
  readability-else-after-return,
  readability-inconsistent-declaration-parameter-name,
  readability-make-member-function-const,
  readability-misleading-indentation,
  readability-non-const-parameter,
  readability-redundant-*,
  readability-simplify-boolean-expr
WarningsAsErrors: '*'
HeaderFilterRegex: '.*/include/easym68k/.*'
