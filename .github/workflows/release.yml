# ==============================================================================
# Release Build Workflow
# ==============================================================================
#
# Two release modes (same as the reference pipeline):
#
# 1. ROLLING SNAPSHOT (manual "Run workflow" on main)
#    - Creates/updates a single "continuous" pre-release tag
#    - Each run REPLACES the previous snapshot (no tag accumulation)
#    - Stable download URL: /releases/tag/continuous
#
# 2. MILESTONE RELEASE (push a v* tag)
#    - Permanent versioned release (v1.0.0, ...)
#
# Pull requests touching the build or packaging build and verify all packages
# without publishing anything.
#
# Packages (one file per platform):
#   Linux    x86_64   .AppImage (portable, private Qt, glibc 2.39+ = Ubuntu
#                      24.04+) and .deb (distro Qt, Ubuntu 24.04+/Debian 13+)
#   macOS    x86_64, arm64   .dmg (macOS 12+, private Qt, ad-hoc signed)
#   Windows  x86_64 (MSVC)   portable .zip (private Qt + CRT DLLs)
#
# Linux builds against the distro Qt (same as the test CI); macOS/Windows
# against the pinned Qt SDK from install-qt-action.
#
# ==============================================================================

name: Release Build

on:
  push:
    tags:
      - 'v*'

  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'install/**'
      - 'gui/**'
      - 'data/**'
      - 'examples/**'
      - '.github/workflows/release.yml'
      - 'tools/package-appimage.sh'

  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # Qt for macOS/Windows (Linux uses the distro Qt to match the test CI and
  # the DEB dependencies). Qt 6.9 supports macOS 12 and later.
  QT_VERSION: '6.9.*'
  MACOS_DEPLOYMENT_TARGET: '12.0'
  # linuxdeploy "continuous" tags move; these pins fail loudly when they do.
  LINUXDEPLOY_SHA256: '8aea8da0f7f7039d2a2cecb14657d752a222a5e1d3825caeef186c82f751cdd1'
  LINUXDEPLOY_QT_SHA256: 'cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.version.outputs.value }}
    steps:
      - name: Generate package version (no manual version bumps)
        id: version
        run: echo "value=$(date -u +%Y%m%d.%H%M%S)" >> "$GITHUB_OUTPUT"

  # ========================================
  # Linux: one distro-Qt build -> DEB + AppImage
  # ========================================
  build-linux:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      EASY68K_PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            qt6-base-dev qt6-multimedia-dev libqt6serialport6-dev \
            file

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_GUI=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES_C=OFF \
            -DEASY68K_PACKAGE_VERSION="${EASY68K_PACKAGE_VERSION}"

      - name: Build
        run: cmake --build build --parallel

      - name: Package DEB
        run: cpack --config build/CPackConfig.cmake -G DEB

      - name: Stage suite for AppImage
        run: cmake --build build --parallel 1 --target package_suite_linux

      - name: Install pinned linuxdeploy
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "${LINUXDEPLOY_QT_SHA256}  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage /usr/local/bin/

      - name: Package AppImage
        run: bash tools/package-appimage.sh build

      - name: Verify AppImage without the build environment
        run: |
          appimage=build/packages/easy68k-qt-Suite-Linux-x86_64.AppImage
          # GUI apps have no --help: surviving the kill timeout proves the
          # bundled Qt loads and the app starts (|| test neutralises the 124
          # under GitHub's -eo pipefail bash).
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QTDIR -u QT_ROOT_DIR -u PATH \
            PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            timeout 20 "./$appimage" || test $? -eq 124
          ./"$appimage" --appimage-extract
          test -f squashfs-root/usr/lib/libQt6Widgets.so.6
          test -f squashfs-root/usr/plugins/platforms/libqxcb.so
          test -f squashfs-root/usr/plugins/platforms/libqoffscreen.so
          test -f squashfs-root/usr/share/easy68k/help/main.htm
          test -f squashfs-root/usr/share/easy68k/examples/README.md
          test -f squashfs-root/usr/share/easy68k/template.NEW
          # CLI end-to-end from inside the extracted AppDir.
          squashfs-root/usr/bin/easy68k-asm \
            squashfs-root/usr/share/easy68k/examples/core/L0-01-hello-simhalt/main.x68
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: easy68k-qt-Suite-Linux-x86_64.AppImage
          path: build/packages/easy68k-qt-Suite-Linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: easy68k-qt-Linux-x86_64.deb
          path: build/packages/easy68k-qt-Linux-x86_64.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Install the DEB in a clean container and run it.
  verify-linux-deb:
    needs: build-linux
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Download DEB
        uses: actions/download-artifact@v8
        with:
          name: easy68k-qt-Linux-x86_64.deb
          path: packages

      - name: Install DEB and verify
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./packages/*.deb file
          # The deb rides on the distro Qt: Depends must have been computed.
          deps=$(dpkg-deb -f packages/*.deb Depends)
          echo "Depends: $deps"
          case "$deps" in *libqt6gui6*) ;; *) echo "expected libqt6 runtime deps" >&2; exit 1;; esac
          test -x /usr/bin/easy68k-simulator
          test -x /usr/bin/easy68k-editor
          test -x /usr/bin/easybin
          test -f /usr/share/applications/easy68k-simulator.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/easy68k-simulator.png
          test -f /usr/share/easy68k/help/main.htm
          test -f /usr/share/easy68k/template.NEW
          # CLI end-to-end: assemble a hello program from stdin-written source.
          printf '        ORG     $1000\nSTART   MOVE.B  #14,D0\n        TRAP    #15\n        SIMHALT\n        END     START\n' > /tmp/hello.x68
          easy68k-asm /tmp/hello.x68

      - name: Download DEB
        uses: actions/download-artifact@v8
        with:
          name: easy68k-qt-Linux-x86_64.deb
          path: packages

  # ========================================
  # Windows MSVC Build (x86_64)
  # ========================================
  build-windows:
    needs: metadata
    runs-on: windows-2022
    env:
      EASY68K_PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: 'desktop'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtserialport'
          cache: true

      - name: Setup MSVC
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_GUI=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES_C=OFF \
            -DEASY68K_PACKAGE_VERSION="${EASY68K_PACKAGE_VERSION}"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Package
        shell: bash
        run: cmake --build build --parallel 1 --target package_suite_windows

      - name: Verify packaged executables
        shell: bash
        timeout-minutes: 2
        working-directory: build/packages/easy68k-qt-Suite
        run: |
          test -f platforms/qwindows.dll
          # The package must carry the VC++ runtime (runner has it in System32).
          test -f msvcp140.dll && test -f vcruntime140.dll
          test -f data/help/main.htm
          test -f examples/README.md
          test -f data/template.NEW
          # Portable package: starts without Qt on PATH; surviving the kill
          # timeout proves the bundled Qt loads (|| test neutralises the 124
          # under GitHub's -eo pipefail bash).
          /usr/bin/env -u QT_PLUGIN_PATH PATH="/c/Windows/System32:/c/Windows" \
            QT_QPA_PLATFORM=windows /usr/bin/timeout 20 ./easy68k-simulator.exe \
            || test $? -eq 124
          ./easy68k-asm.exe examples/core/L0-01-hello-simhalt/main.x68

      - name: Name package
        shell: bash
        run: mv build/packages/easy68k-qt-Suite-Windows.zip build/packages/easy68k-qt-Suite-Windows-x86_64.zip

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: easy68k-qt-Suite-Windows-x86_64.zip
          path: build/packages/easy68k-qt-Suite-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ========================================
  # macOS Build (x86_64 and arm64)
  # ========================================
  build-macos:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel  # Last Intel runner image
            arch: x86_64
          - runner: macos-15        # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      EASY68K_PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia qtserialport'
          cache: true

      - name: Install build dependencies
        run: brew install ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOS_DEPLOYMENT_TARGET }} \
            -DBUILD_GUI=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES_C=OFF \
            -DEASY68K_PACKAGE_VERSION="${EASY68K_PACKAGE_VERSION}"

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          cmake --build build --parallel 1 --target package_suite_macos
          mv build/packages/easy68k-qt-Suite.dmg "build/packages/easy68k-qt-Suite-macOS-${{ matrix.arch }}.dmg"

      # Every Mach-O in the packaged bundles (apps, Qt frameworks, plugins)
      # must run on the minimum macOS and must not load anything from
      # Homebrew & co. (install-ID lines are skipped: they never resolve.)
      - name: Verify macOS deployment target and self-containment
        run: |
          target="${{ env.MACOS_DEPLOYMENT_TARGET }}"
          fail=0
          for app in easy68k-simulator easy68k-editor easybin; do
            plist=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "build/packages/easy68k-qt-Suite/$app.app/Contents/Info.plist")
            if [ "$plist" != "$target" ]; then
              echo "::error::$app.app LSMinimumSystemVersion=$plist, expected $target"; fail=1
            fi
            test -f "build/packages/easy68k-qt-Suite/$app.app/Contents/Resources/data/help/main.htm" || fail=1
            test -d "build/packages/easy68k-qt-Suite/$app.app/Contents/Frameworks" || fail=1
          done
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            if otool -L "$f" | tail -n +3 | grep -E '/opt/homebrew|/usr/local|/opt/local|/opt/Qt|/Users/runner'; then
              echo "::error::$f loads a library from outside the bundle"; fail=1
            fi
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')
            if [ -n "$minos" ] && [ "$(printf '%s\n%s\n' "$minos" "$target" | sort -V | tail -1)" != "$target" ]; then
              echo "::error::$f requires macOS $minos, expected at most $target"; fail=1
            fi
          done < <(find build/packages/easy68k-qt-Suite -type f -print0)
          codesign --verify --deep --strict build/packages/easy68k-qt-Suite/easy68k-simulator.app || fail=1
          exit $fail

      - name: Smoke-test packaged apps and CLI
        timeout-minutes: 2
        run: |
          suite=build/packages/easy68k-qt-Suite
          for app in easy68k-simulator easy68k-editor easybin; do
            rc=0
            timeout 15 "$suite/$app.app/Contents/MacOS/$app" > /dev/null 2>&1 || rc=$?
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
              echo "::error::$app exited with $rc"; exit 1
            fi
          done
          "$suite/easy68k-asm" examples/core/L0-01-hello-simhalt/main.x68

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: easy68k-qt-Suite-macOS-${{ matrix.arch }}.dmg
          path: build/packages/easy68k-qt-Suite-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0  # DMG is already compressed

  # ========================================
  # Create GitHub Release
  # ========================================
  # - workflow_dispatch on main -> Rolling snapshot (replaces "continuous" tag)
  # - tag push (v*)             -> Milestone release (permanent)
  #
  release:
    needs: [metadata, build-linux, verify-linux-deb, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Every artifact holds exactly one file, already carrying its final name.
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > downloads.md <<'EOF'
          ### Downloads

          | Platform | File |
          |----------|------|
          | Linux x86_64, portable (Ubuntu 24.04+, glibc 2.39+) | `easy68k-qt-Suite-Linux-x86_64.AppImage` |
          | Linux x86_64, Ubuntu 24.04+ / Debian 13+ | `easy68k-qt-Linux-x86_64.deb` |
          | macOS 12+, Apple Silicon | `easy68k-qt-Suite-macOS-arm64.dmg` |
          | macOS 12+, Intel | `easy68k-qt-Suite-macOS-x86_64.dmg` |
          | Windows x86_64 | `easy68k-qt-Suite-Windows-x86_64.zip` |

          The AppImage, DMGs and the Windows zip carry their own Qt runtime;
          nothing else needs to be installed. The DEB uses the distribution Qt.

          **macOS:** the DMG is ad-hoc signed (no Apple Developer ID). On first
          launch, right-click the application and choose *Open* to pass
          Gatekeeper, or run `xattr -dr com.apple.quarantine <App>.app`.

          ### Verify Downloads
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          EOF

      # ----------------------------------------------------------------------
      # ROLLING SNAPSHOT MODE (workflow_dispatch on main)
      # ----------------------------------------------------------------------
      - name: Create Rolling Snapshot
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.metadata.outputs.package-version }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "Creating rolling snapshot: $VERSION"

          {
            echo "## Rolling Snapshot Build"
            echo
            echo "**Version:** \`$VERSION\`"
            echo "**Commit:** [\`$SHORT_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "**Built:** $DATE"
            echo
            echo "> ⚠️ **This is a development snapshot.** It may contain bugs and incomplete features."
            echo "> This release is automatically replaced on each new snapshot build."
            echo
            cat downloads.md
          } > notes.md

          # Delete existing continuous release and tag (if any)
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true

          gh release create continuous \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot $VERSION" \
            --notes-file notes.md \
            release/*

      # ----------------------------------------------------------------------
      # MILESTONE RELEASE MODE (v* tag push)
      # ----------------------------------------------------------------------
      - name: Prepare milestone notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "## EASy68K ${{ github.ref_name }}"
            echo
            echo "- **Sim68K** — 68000 simulator with Trap #15 I/O"
            echo "- **Edit68K** — editor and integrated assembler IDE"
            echo "- **EASyBIN** — binary file creation and editing utility"
            echo "- **easy68k-asm / easy68k-sim / easy68k-run** — command-line assembler, simulator, and example runner"
            echo
            cat downloads.md
          } > notes.md

      - name: Create Milestone Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: EASy68K ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body_path: notes.md
          files: release/*
